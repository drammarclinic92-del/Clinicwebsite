name: Deploy ASNA-CA Website ZIP to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "ASNA-CA_Commercial_Platform_Phase2.zip"
      - ".github/workflows/deploy-site-zip-phase2.yml"

  workflow_dispatch:
    inputs:
      zip_file:
        description: "Website ZIP filename in repository root"
        required: true
        default: "ASNA-CA_Commercial_Platform_Phase2.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: asna-ca-website-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Extract and publish website files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select ZIP filename
        id: zip
        shell: bash
        env:
          MANUAL_ZIP: ${{ inputs.zip_file }}
        run: |
          set -euo pipefail

          ZIP_FILE="${MANUAL_ZIP:-ASNA-CA_Commercial_Platform_Phase2.zip}"

          if [[ "$ZIP_FILE" == */* || "$ZIP_FILE" == *".."* ]]; then
            echo "::error::Enter only the ZIP filename, not a path."
            exit 1
          fi

          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP exists and is valid
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail

          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::ZIP file missing or empty: $ZIP_FILE"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          echo "Checking ZIP archive..."
          unzip -t "$ZIP_FILE"

          echo "ZIP contents:"
          unzip -Z1 "$ZIP_FILE" | head -n 100

      - name: Extract website ZIP
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail

          TMP_DIR="$RUNNER_TEMP/asna-ca-website"
          mkdir -p "$TMP_DIR"

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          echo "Looking for index.html..."

          mapfile -t INDEX_FILES < <(
            find "$TMP_DIR" -type f -name index.html
          )

          if [[ "${#INDEX_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one index.html."
            echo "Found ${#INDEX_FILES[@]} index.html files."
            find "$TMP_DIR" -maxdepth 5 -type f | sort
            exit 1
          fi

          SOURCE_DIR="$(dirname "${INDEX_FILES[0]}")"

          echo "Website source: $SOURCE_DIR"

          for FILE in \
            index.html \
            reminder.html \
            clinic-management.html \
            assets/styles.css \
            assets/script.js \
            assets/asna-ca-logo.png
          do
            if [[ ! -s "$SOURCE_DIR/$FILE" ]]; then
              echo "::error::Required file missing: $FILE"
              echo "Extracted files:"
              find "$TMP_DIR" -maxdepth 5 -type f | sort
              exit 1
            fi
          done

          echo "$SOURCE_DIR" > "$RUNNER_TEMP/asna-ca-source-dir.txt"

      - name: Copy website into repository root
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$(cat "$RUNNER_TEMP/asna-ca-source-dir.txt")"

          cp "$SOURCE_DIR/index.html" ./index.html
          cp "$SOURCE_DIR/reminder.html" ./reminder.html
          cp "$SOURCE_DIR/clinic-management.html" ./clinic-management.html

          mkdir -p assets
          cp -R "$SOURCE_DIR/assets/." ./assets/

          echo "Website files installed:"
          ls -la index.html reminder.html clinic-management.html
          find assets -maxdepth 2 -type f | sort

      - name: Validate installed website
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html
          test -s reminder.html
          test -s clinic-management.html
          test -s assets/styles.css
          test -s assets/script.js
          test -s assets/asna-ca-logo.png

          echo "All required website files are present."

      - name: Commit website files to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html reminder.html clinic-management.html assets/

          if git diff --cached --quiet; then
            echo "Website files are already up to date."
          else
            git commit -m "Deploy ASNA-CA website"
            git push origin HEAD:main
          fi

      - name: Deployment summary
        run: |
          echo "Website files are ready in the repository root."
          echo "Expected homepage: index.html"
          echo "Next, check the GitHub Pages deployment."
