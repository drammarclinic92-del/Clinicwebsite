name: Deploy ASNA-CA Website ZIP to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP file uploaded to the repository root"
        required: true
        default: "ASNA-CA_Commercial_Platform_Phase2.zip"

permissions:
  contents: write

concurrency:
  group: deploy-asna-ca-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Install website files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Check uploaded website ZIP
        shell: bash
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          set -euo pipefail
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Website ZIP was not found in the repository root: $ZIP_FILE"
            echo "Upload ASNA-CA_Commercial_Platform_Phase2.zip to the repository root, then run this workflow again."
            exit 1
          fi
          unzip -t "$ZIP_FILE"

      - name: Extract and validate website
        shell: bash
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          if [[ -f "$TMP_DIR/index.html" ]]; then
            SOURCE_DIR="$TMP_DIR"
          else
            mapfile -t INDEX_FILES < <(find "$TMP_DIR" -mindepth 2 -maxdepth 5 -type f -name index.html)
            if [[ "${#INDEX_FILES[@]}" -ne 1 ]]; then
              echo "::error::Could not identify one website root containing index.html."
              find "$TMP_DIR" -maxdepth 5 -type f | sort
              exit 1
            fi
            SOURCE_DIR="$(dirname "${INDEX_FILES[0]}")"
          fi

          for REQUIRED in \
            index.html \
            reminder.html \
            clinic-management.html \
            assets/styles.css \
            assets/script.js \
            assets/asna-ca-logo.png; do
            if [[ ! -s "$SOURCE_DIR/$REQUIRED" ]]; then
              echo "::error::Required website file is missing or empty: $REQUIRED"
              exit 1
            fi
          done

          echo "$SOURCE_DIR" > "$RUNNER_TEMP/asna-ca-source-dir.txt"

      - name: Install website files without deleting clinic images
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$(cat "$RUNNER_TEMP/asna-ca-source-dir.txt")"

          cp "$SOURCE_DIR/index.html" ./index.html
          cp "$SOURCE_DIR/reminder.html" ./reminder.html
          cp "$SOURCE_DIR/clinic-management.html" ./clinic-management.html

          mkdir -p assets
          cp -R "$SOURCE_DIR/assets/." ./assets/

          test -s index.html
          test -s reminder.html
          test -s clinic-management.html
          test -s assets/styles.css
          test -s assets/script.js
          test -s assets/asna-ca-logo.png

      - name: Commit and push website files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html reminder.html clinic-management.html assets/
          if git diff --cached --quiet; then
            echo "Website files are already up to date; no commit is needed."
            exit 0
          fi

          git commit -m "Deploy ASNA-CA website Phase 2"
          git push origin HEAD:main

      - name: Deployment handoff
        run: |
          echo "Website files have been committed to main."
          echo "GitHub Pages should build from main / root. Check the Pages deployment if the live website does not update."
